<!-- @dsCard group="Status" height=56 subtitle="navbatda, ishlanmoqda, tayyor, toʻxtatildi, xato" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StatusBadge — preview</title>
<style>
  html, body { margin:0; }
  body { background:var(--surface-100); font-family:var(--font-sans); padding:var(--space-4); box-sizing:border-box; }
  .row { display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap; }
  .pill { display:inline-flex; align-items:center; gap:var(--space-1); padding:var(--space-1) var(--space-2); border-radius:var(--radius-full); white-space:nowrap; }
  .pill .dot { width:6px; height:6px; border-radius:999px; background:currentColor; }
  .pill-queued { background:var(--muted-subtle); color:var(--muted); }
  .pill-processing { background:var(--accent-subtle); color:var(--accent); }
  .pill-done { background:var(--success-subtle); color:var(--success); }
  .pill-stopped { background:var(--muted-subtle); color:var(--muted); }
  .pill-error { background:var(--danger-subtle); color:var(--danger); }
</style>
</head>
<body>
<div class="row">
  <span class="pill pill-queued label"><span class="dot"></span>Navbatda</span>
  <span class="pill pill-processing label"><span class="dot"></span>Ishlanmoqda 42%</span>
  <span class="pill pill-done label"><span class="dot"></span>Tayyor</span>
  <span class="pill pill-stopped label"><span class="dot"></span>Toʻxtatildi</span>
  <span class="pill pill-error label"><span class="dot"></span>Xato</span>
</div>
</body>
</html>
