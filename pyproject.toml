[project]
name = "darsstudio"
version = "0.0.1"
description = "Dars Studio: lokal, yarim avtomatik videodars montaj tizimi"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "python-pptx>=1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["darsstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "unit: sof Python, GPU'siz",
    "media: ffmpeg kerak, GPU'siz",
    "gpu: CUDA kerak",
    "windows: PowerPoint COM, pywebview, power.py",
    "pilot: haqiqiy darslar (DARS_PILOT_DIR)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["engines", "runtime"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["darsstudio"]
strict = true
