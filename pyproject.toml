[project]
name = "darsstudio"
version = "0.0.1"
description = "Dars Studio: lokal, yarim avtomatik videodars montaj tizimi"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2",
    "pydantic>=2.7",
    "pypdfium2>=4.30",
    "rapidfuzz>=3",
    "python-pptx>=1.0",
    "xxhash>=3",
    # GPU: torch cu128 build — https://download.pytorch.org/whl/cu128 (TZ 3.3)
    "torch>=2.7",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "faster-whisper>=1.1",
    "transformers>=4.45",
    "silero-vad>=5",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "psutil>=5.9",
    "pywebview>=5; sys_platform == 'win32'",
    "huggingface_hub>=0.24",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "types-psutil",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["darsstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "unit: sof Python, GPU'siz",
    "media: ffmpeg kerak, GPU'siz",
    "gpu: CUDA kerak",
    "windows: PowerPoint COM, pywebview, power.py",
    "pilot: haqiqiy darslar (DARS_PILOT_DIR)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["engines", "runtime"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["darsstudio"]
strict = true
plugins = ["pydantic.mypy"]

# TZ 10.1: asosiy modullar strict. Numerik kod (cv2/torch/numpy stub'lari noaniq) uchun yumshatilgan.
[[tool.mypy.overrides]]
module = ["darsstudio.render.*", "darsstudio.slides.*", "darsstudio.cli", "darsstudio.asr.engines.*", "darsstudio.api.*", "darsstudio.export.*"]
disallow_untyped_calls = false
disable_error_code = ["arg-type", "call-overload", "assignment", "list-item", "no-any-return"]

[[tool.mypy.overrides]]
module = ["lxml.*", "pythoncom", "win32com.*", "pypdfium2.*", "df.*", "df", "silero_vad", "faster_whisper", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tools/package.py" = ["E501"]  # ichki .bat matni
